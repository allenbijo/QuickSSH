appId: com.quickssh.app
productName: Quick SSH
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!**/.vscode/*"
  - "!src/**/*"
extraResources:
  - from: resources/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: resources/icon.ico
  signingHashAlgorithms: null
  sign: null
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  # icon.icns required for macOS — convert icon.ico using iconutil or an online converter
  # and place at resources/icon.icns
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlementsInherit: null
linux:
  target:
    - target: deb
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  # icon.png (512x512) required for Linux — place at resources/icon.png
  category: Development
npmRebuild: true
